naftiko: 1.0.0-alpha2
info:
  label: 'Akamai: Application Security API — Activation history'
  description: 'Akamai: Application Security API — Activation history. 1 operations. Lead operation: Akamai API Security List
    Activation History. Self-contained Naftiko capability covering one Akamai Api Security business surface.'
  tags:
  - Akamai Api Security
  - Activation history
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AKAMAI_API_SECURITY_API_KEY: AKAMAI_API_SECURITY_API_KEY
capability:
  consumes:
  - type: http
    namespace: akamai-api-security-activation-history
    baseUri: https://{hostname}/appsec/v1
    description: 'Akamai: Application Security API — Activation history business capability. Self-contained, no shared references.'
    resources:
    - name: configs-configId-activations
      path: /configs/{configId}/activations
      operations:
      - name: getactivationhistory
        method: GET
        description: Akamai API Security List Activation History
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountSwitchKey
          in: query
          type: string
          description: For customers who manage more than one account, this [runs the operation from another account](https://techdocs.akamai.com/developer/docs/manage-many-accounts-w
  exposes:
  - type: rest
    namespace: akamai-api-security-activation-history-rest
    port: 8080
    description: 'REST adapter for Akamai: Application Security API — Activation history. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.'
    resources:
    - path: /v1/configs/{configid}/activations
      name: configs-configid-activations
      description: REST surface for configs-configId-activations.
      operations:
      - method: GET
        name: getactivationhistory
        description: Akamai API Security List Activation History
        call: akamai-api-security-activation-history.getactivationhistory
        with:
          accountSwitchKey: rest.accountSwitchKey
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: akamai-api-security-activation-history-mcp
    port: 9090
    transport: http
    description: 'MCP adapter for Akamai: Application Security API — Activation history. One tool per consumed operation,
      routed inline through this capability''s consumes block.'
    tools:
    - name: akamai-api-security-list-activation
      description: Akamai API Security List Activation History
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: akamai-api-security-activation-history.getactivationhistory
      with:
        accountSwitchKey: tools.accountSwitchKey
      outputParameters:
      - type: object
        mapping: $.
