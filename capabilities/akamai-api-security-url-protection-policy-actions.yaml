naftiko: 1.0.0-alpha2
info:
  label: 'Akamai: Application Security API — URL protection policy actions'
  description: 'Akamai: Application Security API — URL protection policy actions. 2 operations. Lead operation: Akamai API
    Security List URL Protection Policy Actions. Self-contained Naftiko capability covering one Akamai Api Security business
    surface.'
  tags:
  - Akamai Api Security
  - URL protection policy actions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AKAMAI_API_SECURITY_API_KEY: AKAMAI_API_SECURITY_API_KEY
capability:
  consumes:
  - type: http
    namespace: akamai-api-security-url-protection-policy-actions
    baseUri: https://{hostname}/appsec/v1
    description: 'Akamai: Application Security API — URL protection policy actions business capability. Self-contained, no
      shared references.'
    resources:
    - name: configs-configId-versions-versionNumber-security-policies-policyId-url-protectio
      path: /configs/{configId}/versions/{versionNumber}/security-policies/{policyId}/url-protections
      operations:
      - name: geturlprotectionpoliciesactions
        method: GET
        description: Akamai API Security List URL Protection Policy Actions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountSwitchKey
          in: query
          type: string
          description: For customers who manage more than one account, this [runs the operation from another account](https://techdocs.akamai.com/developer/docs/manage-many-accounts-w
    - name: configs-configId-versions-versionNumber-security-policies-policyId-url-protectio
      path: /configs/{configId}/versions/{versionNumber}/security-policies/{policyId}/url-protections/{urlProtectionPolicyId}
      operations:
      - name: puturlprotectionpolicyaction
        method: PUT
        description: Akamai API Security Modify a URL Protection Policy Action
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountSwitchKey
          in: query
          type: string
          description: For customers who manage more than one account, this [runs the operation from another account](https://techdocs.akamai.com/developer/docs/manage-many-accounts-w
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: akamai-api-security-url-protection-policy-actions-rest
    port: 8080
    description: 'REST adapter for Akamai: Application Security API — URL protection policy actions. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.'
    resources:
    - path: /v1/configs/{configid}/versions/{versionnumber}/security-policies/{policyid}/url-protections
      name: configs-configid-versions-versionnumber-security-policies-policyid-url-protectio
      description: REST surface for configs-configId-versions-versionNumber-security-policies-policyId-url-protectio.
      operations:
      - method: GET
        name: geturlprotectionpoliciesactions
        description: Akamai API Security List URL Protection Policy Actions
        call: akamai-api-security-url-protection-policy-actions.geturlprotectionpoliciesactions
        with:
          accountSwitchKey: rest.accountSwitchKey
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/configs/{configid}/versions/{versionnumber}/security-policies/{policyid}/url-protections/{urlprotectionpolicyid}
      name: configs-configid-versions-versionnumber-security-policies-policyid-url-protectio
      description: REST surface for configs-configId-versions-versionNumber-security-policies-policyId-url-protectio.
      operations:
      - method: PUT
        name: puturlprotectionpolicyaction
        description: Akamai API Security Modify a URL Protection Policy Action
        call: akamai-api-security-url-protection-policy-actions.puturlprotectionpolicyaction
        with:
          accountSwitchKey: rest.accountSwitchKey
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: akamai-api-security-url-protection-policy-actions-mcp
    port: 9090
    transport: http
    description: 'MCP adapter for Akamai: Application Security API — URL protection policy actions. One tool per consumed
      operation, routed inline through this capability''s consumes block.'
    tools:
    - name: akamai-api-security-list-url
      description: Akamai API Security List URL Protection Policy Actions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: akamai-api-security-url-protection-policy-actions.geturlprotectionpoliciesactions
      with:
        accountSwitchKey: tools.accountSwitchKey
      outputParameters:
      - type: object
        mapping: $.
    - name: akamai-api-security-modify-url
      description: Akamai API Security Modify a URL Protection Policy Action
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: akamai-api-security-url-protection-policy-actions.puturlprotectionpolicyaction
      with:
        accountSwitchKey: tools.accountSwitchKey
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
