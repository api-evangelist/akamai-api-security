naftiko: 1.0.0-alpha2
info:
  label: 'Akamai: Application Security API — API endpoints'
  description: 'Akamai: Application Security API — API endpoints. 1 operations. Lead operation: Akamai API Security List API
    Endpoints. Self-contained Naftiko capability covering one Akamai Api Security business surface.'
  tags:
  - Akamai Api Security
  - API endpoints
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AKAMAI_API_SECURITY_API_KEY: AKAMAI_API_SECURITY_API_KEY
capability:
  consumes:
  - type: http
    namespace: akamai-api-security-api-endpoints
    baseUri: https://{hostname}/appsec/v1
    description: 'Akamai: Application Security API — API endpoints business capability. Self-contained, no shared references.'
    resources:
    - name: configs-configId-versions-versionNumber-security-policies-policyId-api-endpoints
      path: /configs/{configId}/versions/{versionNumber}/security-policies/{policyId}/api-endpoints
      operations:
      - name: getapiendpoints
        method: GET
        description: Akamai API Security List API Endpoints
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountSwitchKey
          in: query
          type: string
          description: For customers who manage more than one account, this [runs the operation from another account](https://techdocs.akamai.com/developer/docs/manage-many-accounts-w
  exposes:
  - type: rest
    namespace: akamai-api-security-api-endpoints-rest
    port: 8080
    description: 'REST adapter for Akamai: Application Security API — API endpoints. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.'
    resources:
    - path: /v1/configs/{configid}/versions/{versionnumber}/security-policies/{policyid}/api-endpoints
      name: configs-configid-versions-versionnumber-security-policies-policyid-api-endpoints
      description: REST surface for configs-configId-versions-versionNumber-security-policies-policyId-api-endpoints.
      operations:
      - method: GET
        name: getapiendpoints
        description: Akamai API Security List API Endpoints
        call: akamai-api-security-api-endpoints.getapiendpoints
        with:
          accountSwitchKey: rest.accountSwitchKey
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: akamai-api-security-api-endpoints-mcp
    port: 9090
    transport: http
    description: 'MCP adapter for Akamai: Application Security API — API endpoints. One tool per consumed operation, routed
      inline through this capability''s consumes block.'
    tools:
    - name: akamai-api-security-list-api
      description: Akamai API Security List API Endpoints
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: akamai-api-security-api-endpoints.getapiendpoints
      with:
        accountSwitchKey: tools.accountSwitchKey
      outputParameters:
      - type: object
        mapping: $.
