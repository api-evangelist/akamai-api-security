  - type: http
    namespace: akamai-api-security-api-request-constraints
    baseUri: https://{hostname}/appsec/v1
    description: 'Akamai: Application Security API — API request constraints business capability. Self-contained, no shared
      references.'
    resources:
    - name: configs-configId-versions-versionNumber-security-policies-policyId-api-request-c
      path: /configs/{configId}/versions/{versionNumber}/security-policies/{policyId}/api-request-constraints
      operations:
      - name: getapirequestconstraints
        method: GET
        description: Akamai API Security List API Request Constraints and Actions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountSwitchKey
          in: query
          type: string
          description: For customers who manage more than one account, this [runs the operation from another account](https://techdocs.akamai.com/developer/docs/manage-many-accounts-w
      - name: putapirequestconstraints
        method: PUT
        description: Akamai API Security Modify the Request Constraint Action for All APIs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountSwitchKey
          in: query
          type: string
          description: For customers who manage more than one account, this [runs the operation from another account](https://techdocs.akamai.com/developer/docs/manage-many-accounts-w
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: configs-configId-versions-versionNumber-security-policies-policyId-api-request-c
      path: /configs/{configId}/versions/{versionNumber}/security-policies/{policyId}/api-request-constraints/{apiId}
      operations:
      - name: putapirequestconstraintsapi
        method: PUT
        description: Akamai API Security Modify an API Request Constraint's Action
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountSwitchKey
          in: query
          type: string
          description: For customers who manage more than one account, this [runs the operation from another account](https://techdocs.akamai.com/developer/docs/manage-many-accounts-w
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: akamai-api-security-api-request-constraints-rest
    port: 8080
    description: 'REST adapter for Akamai: Application Security API — API request constraints. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.'
    resources:
    - path: /v1/configs/{configid}/versions/{versionnumber}/security-policies/{policyid}/api-request-constraints
      name: configs-configid-versions-versionnumber-security-policies-policyid-api-request-c
      description: REST surface for configs-configId-versions-versionNumber-security-policies-policyId-api-request-c.
      operations:
      - method: GET
        name: getapirequestconstraints
        description: Akamai API Security List API Request Constraints and Actions
        call: akamai-api-security-api-request-constraints.getapirequestconstraints
        with:
          accountSwitchKey: rest.accountSwitchKey
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: putapirequestconstraints
        description: Akamai API Security Modify the Request Constraint Action for All APIs
        call: akamai-api-security-api-request-constraints.putapirequestconstraints
        with:
          accountSwitchKey: rest.accountSwitchKey
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/configs/{configid}/versions/{versionnumber}/security-policies/{policyid}/api-request-constraints/{apiid}
      name: configs-configid-versions-versionnumber-security-policies-policyid-api-request-c
      description: REST surface for configs-configId-versions-versionNumber-security-policies-policyId-api-request-c.
      operations:
      - method: PUT
        name: putapirequestconstraintsapi
        description: Akamai API Security Modify an API Request Constraint's Action
        call: akamai-api-security-api-request-constraints.putapirequestconstraintsapi
        with:
          accountSwitchKey: rest.accountSwitchKey
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
