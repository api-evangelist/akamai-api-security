    port: 9090
    transport: http
    description: 'MCP adapter for Akamai: Application Security API — API request constraints. One tool per consumed operation,
      routed inline through this capability''s consumes block.'
    tools:
    - name: akamai-api-security-list-api
      description: Akamai API Security List API Request Constraints and Actions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: akamai-api-security-api-request-constraints.getapirequestconstraints
      with:
        accountSwitchKey: tools.accountSwitchKey
      outputParameters:
      - type: object
        mapping: $.
    - name: akamai-api-security-modify-request
      description: Akamai API Security Modify the Request Constraint Action for All APIs
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: akamai-api-security-api-request-constraints.putapirequestconstraints
      with:
        accountSwitchKey: tools.accountSwitchKey
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: akamai-api-security-modify-api
      description: Akamai API Security Modify an API Request Constraint's Action
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: akamai-api-security-api-request-constraints.putapirequestconstraintsapi
      with:
        accountSwitchKey: tools.accountSwitchKey
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
