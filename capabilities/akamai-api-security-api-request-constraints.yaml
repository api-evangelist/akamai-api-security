naftiko: 1.0.0-alpha2
info:
  label: 'Akamai: Application Security API — API request constraints'
  description: 'Akamai: Application Security API — API request constraints. 3 operations. Lead operation: Akamai API Security
    List API Request Constraints and Actions. Self-contained Naftiko capability covering one Akamai Api Security business
    surface.'
  tags:
  - Akamai Api Security
  - API request constraints
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AKAMAI_API_SECURITY_API_KEY: AKAMAI_API_SECURITY_API_KEY
capability:
