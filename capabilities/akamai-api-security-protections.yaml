naftiko: 1.0.0-alpha2
info:
  label: 'Akamai: Application Security API — Protections'
  description: 'Akamai: Application Security API — Protections. 2 operations. Lead operation: Akamai API Security Get Protections.
    Self-contained Naftiko capability covering one Akamai Api Security business surface.'
  tags:
  - Akamai Api Security
  - Protections
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AKAMAI_API_SECURITY_API_KEY: AKAMAI_API_SECURITY_API_KEY
capability:
  consumes:
  - type: http
    namespace: akamai-api-security-protections
    baseUri: https://{hostname}/appsec/v1
    description: 'Akamai: Application Security API — Protections business capability. Self-contained, no shared references.'
    resources:
    - name: configs-configId-versions-versionNumber-security-policies-policyId-protections
      path: /configs/{configId}/versions/{versionNumber}/security-policies/{policyId}/protections
      operations:
      - name: getpolicyprotections
        method: GET
        description: Akamai API Security Get Protections
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountSwitchKey
          in: query
          type: string
          description: For customers who manage more than one account, this [runs the operation from another account](https://techdocs.akamai.com/developer/docs/manage-many-accounts-w
      - name: putpolicyprotections
        method: PUT
        description: Akamai API Security Modify Protections
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountSwitchKey
          in: query
          type: string
          description: For customers who manage more than one account, this [runs the operation from another account](https://techdocs.akamai.com/developer/docs/manage-many-accounts-w
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: akamai-api-security-protections-rest
    port: 8080
    description: 'REST adapter for Akamai: Application Security API — Protections. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.'
    resources:
    - path: /v1/configs/{configid}/versions/{versionnumber}/security-policies/{policyid}/protections
      name: configs-configid-versions-versionnumber-security-policies-policyid-protections
      description: REST surface for configs-configId-versions-versionNumber-security-policies-policyId-protections.
      operations:
      - method: GET
        name: getpolicyprotections
        description: Akamai API Security Get Protections
        call: akamai-api-security-protections.getpolicyprotections
        with:
          accountSwitchKey: rest.accountSwitchKey
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: putpolicyprotections
        description: Akamai API Security Modify Protections
        call: akamai-api-security-protections.putpolicyprotections
        with:
          accountSwitchKey: rest.accountSwitchKey
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: akamai-api-security-protections-mcp
    port: 9090
    transport: http
    description: 'MCP adapter for Akamai: Application Security API — Protections. One tool per consumed operation, routed
      inline through this capability''s consumes block.'
    tools:
    - name: akamai-api-security-get-protections
      description: Akamai API Security Get Protections
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: akamai-api-security-protections.getpolicyprotections
      with:
        accountSwitchKey: tools.accountSwitchKey
      outputParameters:
      - type: object
        mapping: $.
    - name: akamai-api-security-modify-protections
      description: Akamai API Security Modify Protections
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: akamai-api-security-protections.putpolicyprotections
      with:
        accountSwitchKey: tools.accountSwitchKey
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
