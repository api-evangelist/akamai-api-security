naftiko: 1.0.0-alpha2
info:
  label: 'Akamai: Application Security API — IP/Geo Firewall settings'
  description: 'Akamai: Application Security API — IP/Geo Firewall settings. 2 operations. Lead operation: Akamai API Security
    Get IP/Geo Firewall Settings. Self-contained Naftiko capability covering one Akamai Api Security business surface.'
  tags:
