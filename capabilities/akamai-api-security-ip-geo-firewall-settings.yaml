    description: 'Akamai: Application Security API — IP/Geo Firewall settings business capability. Self-contained, no shared
      references.'
    resources:
    - name: configs-configId-versions-versionNumber-security-policies-policyId-ip-geo-firewa
      path: /configs/{configId}/versions/{versionNumber}/security-policies/{policyId}/ip-geo-firewall
      operations:
      - name: getpolicyipgeofirewall
        method: GET
        description: Akamai API Security Get IP/Geo Firewall Settings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountSwitchKey
          in: query
          type: string
          description: For customers who manage more than one account, this [runs the operation from another account](https://techdocs.akamai.com/developer/docs/manage-many-accounts-w
      - name: putpolicyipgeofirewall
        method: PUT
        description: Akamai API Security Modify IP/Geo Firewall Settings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountSwitchKey
