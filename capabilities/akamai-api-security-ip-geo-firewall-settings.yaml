      operations:
      - method: GET
        name: getpolicyipgeofirewall
        description: Akamai API Security Get IP/Geo Firewall Settings
        call: akamai-api-security-ip-geo-firewall-settings.getpolicyipgeofirewall
        with:
          accountSwitchKey: rest.accountSwitchKey
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: putpolicyipgeofirewall
        description: Akamai API Security Modify IP/Geo Firewall Settings
        call: akamai-api-security-ip-geo-firewall-settings.putpolicyipgeofirewall
        with:
