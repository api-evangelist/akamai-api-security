      path: /configs/{configId}/versions/{versionNumber}/advanced-settings/logging/attack-payload
      operations:
      - name: getadvancedsettingsattackpayloadlogging
        method: GET
        description: Akamai API Security Get the Attack Payload Log Settings for a Configuration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountSwitchKey
          in: query
          type: string
          description: For customers who manage more than one account, this [runs the operation from another account](https://techdocs.akamai.com/developer/docs/manage-many-accounts-w
      - name: putadvancedsettingsattackpayloadlogging
        method: PUT
        description: Akamai API Security Modify Attack Payload Log Settings for a Configuration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
