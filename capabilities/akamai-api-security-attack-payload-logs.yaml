  description: 'Akamai: Application Security API — Attack payload logs. 4 operations. Lead operation: Akamai API Security
    Get the Attack Payload Log Settings for a Configuration. Self-contained Naftiko capability covering one Akamai Api Security
    business surface.'
  tags:
  - Akamai Api Security
  - Attack payload logs
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
