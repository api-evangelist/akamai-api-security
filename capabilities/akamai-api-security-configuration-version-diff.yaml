naftiko: 1.0.0-alpha2
info:
  label: 'Akamai: Application Security API — Configuration version diff'
  description: 'Akamai: Application Security API — Configuration version diff. 1 operations. Lead operation: Akamai API Security
    Compare Two Versions. Self-contained Naftiko capability covering one Akamai Api Security business surface.'
  tags:
  - Akamai Api Security
  - Configuration version diff
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AKAMAI_API_SECURITY_API_KEY: AKAMAI_API_SECURITY_API_KEY
capability:
  consumes:
  - type: http
    namespace: akamai-api-security-configuration-version-diff
    baseUri: https://{hostname}/appsec/v1
    description: 'Akamai: Application Security API — Configuration version diff business capability. Self-contained, no shared
      references.'
    resources:
    - name: configs-configId-versions-diff
      path: /configs/{configId}/versions/diff
      operations:
      - name: postconfigversionsdiff
        method: POST
        description: Akamai API Security Compare Two Versions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountSwitchKey
          in: query
          type: string
          description: For customers who manage more than one account, this [runs the operation from another account](https://techdocs.akamai.com/developer/docs/manage-many-accounts-w
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: akamai-api-security-configuration-version-diff-rest
    port: 8080
    description: 'REST adapter for Akamai: Application Security API — Configuration version diff. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.'
    resources:
    - path: /v1/configs/{configid}/versions/diff
      name: configs-configid-versions-diff
      description: REST surface for configs-configId-versions-diff.
      operations:
      - method: POST
        name: postconfigversionsdiff
        description: Akamai API Security Compare Two Versions
        call: akamai-api-security-configuration-version-diff.postconfigversionsdiff
        with:
          accountSwitchKey: rest.accountSwitchKey
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: akamai-api-security-configuration-version-diff-mcp
    port: 9090
    transport: http
    description: 'MCP adapter for Akamai: Application Security API — Configuration version diff. One tool per consumed operation,
      routed inline through this capability''s consumes block.'
    tools:
    - name: akamai-api-security-compare-two
      description: Akamai API Security Compare Two Versions
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: akamai-api-security-configuration-version-diff.postconfigversionsdiff
      with:
        accountSwitchKey: tools.accountSwitchKey
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
