naftiko: 1.0.0-alpha2
info:
  label: 'Akamai: Application Security API — Security policy: Evaluation mode'
  description: 'Akamai: Application Security API — Security policy: Evaluation mode. 1 operations. Lead operation: Akamai
    API Security Set Evaluation Mode. Self-contained Naftiko capability covering one Akamai Api Security business surface.'
  tags:
  - Akamai Api Security
  - 'Security policy: Evaluation mode'
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AKAMAI_API_SECURITY_API_KEY: AKAMAI_API_SECURITY_API_KEY
capability:
  consumes:
  - type: http
    namespace: akamai-api-security-security-policy-evaluation-mode
    baseUri: https://{hostname}/appsec/v1
    description: 'Akamai: Application Security API — Security policy: Evaluation mode business capability. Self-contained,
      no shared references.'
    resources:
    - name: configs-configId-versions-versionNumber-security-policies-policyId-eval
      path: /configs/{configId}/versions/{versionNumber}/security-policies/{policyId}/eval
      operations:
      - name: postpolicyeval
        method: POST
        description: Akamai API Security Set Evaluation Mode
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountSwitchKey
          in: query
          type: string
          description: For customers who manage more than one account, this [runs the operation from another account](https://techdocs.akamai.com/developer/docs/manage-many-accounts-w
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: akamai-api-security-security-policy-evaluation-mode-rest
    port: 8080
    description: 'REST adapter for Akamai: Application Security API — Security policy: Evaluation mode. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.'
    resources:
    - path: /v1/configs/{configid}/versions/{versionnumber}/security-policies/{policyid}/eval
      name: configs-configid-versions-versionnumber-security-policies-policyid-eval
      description: REST surface for configs-configId-versions-versionNumber-security-policies-policyId-eval.
      operations:
      - method: POST
        name: postpolicyeval
        description: Akamai API Security Set Evaluation Mode
        call: akamai-api-security-security-policy-evaluation-mode.postpolicyeval
        with:
          accountSwitchKey: rest.accountSwitchKey
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: akamai-api-security-security-policy-evaluation-mode-mcp
    port: 9090
    transport: http
    description: 'MCP adapter for Akamai: Application Security API — Security policy: Evaluation mode. One tool per consumed
      operation, routed inline through this capability''s consumes block.'
    tools:
    - name: akamai-api-security-set-evaluation
      description: Akamai API Security Set Evaluation Mode
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: akamai-api-security-security-policy-evaluation-mode.postpolicyeval
      with:
        accountSwitchKey: tools.accountSwitchKey
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
