naftiko: 1.0.0-alpha2
info:
  label: 'Akamai: Application Security API — Reputation analysis'
  description: 'Akamai: Application Security API — Reputation analysis. 2 operations. Lead operation: Akamai API Security
    Get Reputation Analysis Settings. Self-contained Naftiko capability covering one Akamai Api Security business surface.'
  tags:
  - Akamai Api Security
  - Reputation analysis
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AKAMAI_API_SECURITY_API_KEY: AKAMAI_API_SECURITY_API_KEY
capability:
  consumes:
  - type: http
    namespace: akamai-api-security-reputation-analysis
    baseUri: https://{hostname}/appsec/v1
    description: 'Akamai: Application Security API — Reputation analysis business capability. Self-contained, no shared references.'
    resources:
    - name: configs-configId-versions-versionNumber-security-policies-policyId-reputation-an
      path: /configs/{configId}/versions/{versionNumber}/security-policies/{policyId}/reputation-analysis
      operations:
      - name: getreputationanalysis
        method: GET
        description: Akamai API Security Get Reputation Analysis Settings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountSwitchKey
          in: query
          type: string
          description: For customers who manage more than one account, this [runs the operation from another account](https://techdocs.akamai.com/developer/docs/manage-many-accounts-w
      - name: putreputationanalysis
        method: PUT
        description: Akamai API Security Modify Reputation Analysis Settings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountSwitchKey
          in: query
          type: string
          description: For customers who manage more than one account, this [runs the operation from another account](https://techdocs.akamai.com/developer/docs/manage-many-accounts-w
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: akamai-api-security-reputation-analysis-rest
    port: 8080
    description: 'REST adapter for Akamai: Application Security API — Reputation analysis. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.'
    resources:
    - path: /v1/configs/{configid}/versions/{versionnumber}/security-policies/{policyid}/reputation-analysis
      name: configs-configid-versions-versionnumber-security-policies-policyid-reputation-an
      description: REST surface for configs-configId-versions-versionNumber-security-policies-policyId-reputation-an.
      operations:
      - method: GET
        name: getreputationanalysis
        description: Akamai API Security Get Reputation Analysis Settings
        call: akamai-api-security-reputation-analysis.getreputationanalysis
        with:
          accountSwitchKey: rest.accountSwitchKey
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: putreputationanalysis
        description: Akamai API Security Modify Reputation Analysis Settings
        call: akamai-api-security-reputation-analysis.putreputationanalysis
        with:
          accountSwitchKey: rest.accountSwitchKey
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: akamai-api-security-reputation-analysis-mcp
    port: 9090
    transport: http
    description: 'MCP adapter for Akamai: Application Security API — Reputation analysis. One tool per consumed operation,
      routed inline through this capability''s consumes block.'
    tools:
    - name: akamai-api-security-get-reputation
      description: Akamai API Security Get Reputation Analysis Settings
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: akamai-api-security-reputation-analysis.getreputationanalysis
      with:
        accountSwitchKey: tools.accountSwitchKey
      outputParameters:
      - type: object
        mapping: $.
    - name: akamai-api-security-modify-reputation
      description: Akamai API Security Modify Reputation Analysis Settings
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: akamai-api-security-reputation-analysis.putreputationanalysis
      with:
        accountSwitchKey: tools.accountSwitchKey
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
