naftiko: 1.0.0-alpha2
info:
  label: 'Akamai: Application Security API — Request body size'
  description: 'Akamai: Application Security API — Request body size. 2 operations. Lead operation: Akamai API Security Get
    Request Body Size Settings for a Configuration. Self-contained Naftiko capability covering one Akamai Api Security business
    surface.'
  tags:
  - Akamai Api Security
  - Request body size
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AKAMAI_API_SECURITY_API_KEY: AKAMAI_API_SECURITY_API_KEY
capability:
  consumes:
  - type: http
    namespace: akamai-api-security-request-body-size
    baseUri: https://{hostname}/appsec/v1
    description: 'Akamai: Application Security API — Request body size business capability. Self-contained, no shared references.'
    resources:
    - name: configs-configId-versions-versionNumber-advanced-settings-request-body
      path: /configs/{configId}/versions/{versionNumber}/advanced-settings/request-body
      operations:
      - name: getadvancedsettingsrequestbody
        method: GET
        description: Akamai API Security Get Request Body Size Settings for a Configuration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountSwitchKey
          in: query
          type: string
          description: For customers who manage more than one account, this [runs the operation from another account](https://techdocs.akamai.com/developer/docs/manage-many-accounts-w
      - name: putadvancedsettingsrequestbody
        method: PUT
        description: Akamai API Security Modify Request Body Inspection Limit Settings for a Configuration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountSwitchKey
          in: query
          type: string
          description: For customers who manage more than one account, this [runs the operation from another account](https://techdocs.akamai.com/developer/docs/manage-many-accounts-w
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: akamai-api-security-request-body-size-rest
    port: 8080
    description: 'REST adapter for Akamai: Application Security API — Request body size. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.'
    resources:
    - path: /v1/configs/{configid}/versions/{versionnumber}/advanced-settings/request-body
      name: configs-configid-versions-versionnumber-advanced-settings-request-body
      description: REST surface for configs-configId-versions-versionNumber-advanced-settings-request-body.
      operations:
      - method: GET
        name: getadvancedsettingsrequestbody
        description: Akamai API Security Get Request Body Size Settings for a Configuration
        call: akamai-api-security-request-body-size.getadvancedsettingsrequestbody
        with:
          accountSwitchKey: rest.accountSwitchKey
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: putadvancedsettingsrequestbody
        description: Akamai API Security Modify Request Body Inspection Limit Settings for a Configuration
        call: akamai-api-security-request-body-size.putadvancedsettingsrequestbody
        with:
          accountSwitchKey: rest.accountSwitchKey
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: akamai-api-security-request-body-size-mcp
    port: 9090
    transport: http
    description: 'MCP adapter for Akamai: Application Security API — Request body size. One tool per consumed operation, routed
      inline through this capability''s consumes block.'
    tools:
    - name: akamai-api-security-get-request
      description: Akamai API Security Get Request Body Size Settings for a Configuration
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: akamai-api-security-request-body-size.getadvancedsettingsrequestbody
      with:
        accountSwitchKey: tools.accountSwitchKey
      outputParameters:
      - type: object
        mapping: $.
    - name: akamai-api-security-modify-request
      description: Akamai API Security Modify Request Body Inspection Limit Settings for a Configuration
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: akamai-api-security-request-body-size.putadvancedsettingsrequestbody
      with:
        accountSwitchKey: tools.accountSwitchKey
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
