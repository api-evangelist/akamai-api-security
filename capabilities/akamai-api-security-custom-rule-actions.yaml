naftiko: 1.0.0-alpha2
info:
  label: 'Akamai: Application Security API — Custom rule actions'
  description: 'Akamai: Application Security API — Custom rule actions. 2 operations. Lead operation: Akamai API Security
    List Custom Rule Actions. Self-contained Naftiko capability covering one Akamai Api Security business surface.'
  tags:
  - Akamai Api Security
  - Custom rule actions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AKAMAI_API_SECURITY_API_KEY: AKAMAI_API_SECURITY_API_KEY
capability:
  consumes:
  - type: http
    namespace: akamai-api-security-custom-rule-actions
    baseUri: https://{hostname}/appsec/v1
    description: 'Akamai: Application Security API — Custom rule actions business capability. Self-contained, no shared references.'
    resources:
    - name: configs-configId-versions-versionNumber-security-policies-policyId-custom-rules
      path: /configs/{configId}/versions/{versionNumber}/security-policies/{policyId}/custom-rules
      operations:
      - name: getcustomrules
        method: GET
        description: Akamai API Security List Custom Rule Actions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountSwitchKey
          in: query
          type: string
          description: For customers who manage more than one account, this [runs the operation from another account](https://techdocs.akamai.com/developer/docs/manage-many-accounts-w
    - name: configs-configId-versions-versionNumber-security-policies-policyId-custom-rules-
      path: /configs/{configId}/versions/{versionNumber}/security-policies/{policyId}/custom-rules/{ruleId}
      operations:
      - name: putcustomrule
        method: PUT
        description: Akamai API Security Modify a Custom Rule Action
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountSwitchKey
          in: query
          type: string
          description: For customers who manage more than one account, this [runs the operation from another account](https://techdocs.akamai.com/developer/docs/manage-many-accounts-w
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: akamai-api-security-custom-rule-actions-rest
    port: 8080
    description: 'REST adapter for Akamai: Application Security API — Custom rule actions. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.'
    resources:
    - path: /v1/configs/{configid}/versions/{versionnumber}/security-policies/{policyid}/custom-rules
      name: configs-configid-versions-versionnumber-security-policies-policyid-custom-rules
      description: REST surface for configs-configId-versions-versionNumber-security-policies-policyId-custom-rules.
      operations:
      - method: GET
        name: getcustomrules
        description: Akamai API Security List Custom Rule Actions
        call: akamai-api-security-custom-rule-actions.getcustomrules
        with:
          accountSwitchKey: rest.accountSwitchKey
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/configs/{configid}/versions/{versionnumber}/security-policies/{policyid}/custom-rules/{ruleid}
      name: configs-configid-versions-versionnumber-security-policies-policyid-custom-rules
      description: REST surface for configs-configId-versions-versionNumber-security-policies-policyId-custom-rules-.
      operations:
      - method: PUT
        name: putcustomrule
        description: Akamai API Security Modify a Custom Rule Action
        call: akamai-api-security-custom-rule-actions.putcustomrule
        with:
          accountSwitchKey: rest.accountSwitchKey
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: akamai-api-security-custom-rule-actions-mcp
    port: 9090
    transport: http
    description: 'MCP adapter for Akamai: Application Security API — Custom rule actions. One tool per consumed operation,
      routed inline through this capability''s consumes block.'
    tools:
    - name: akamai-api-security-list-custom
      description: Akamai API Security List Custom Rule Actions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: akamai-api-security-custom-rule-actions.getcustomrules
      with:
        accountSwitchKey: tools.accountSwitchKey
      outputParameters:
      - type: object
        mapping: $.
    - name: akamai-api-security-modify-custom
      description: Akamai API Security Modify a Custom Rule Action
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: akamai-api-security-custom-rule-actions.putcustomrule
      with:
        accountSwitchKey: tools.accountSwitchKey
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
