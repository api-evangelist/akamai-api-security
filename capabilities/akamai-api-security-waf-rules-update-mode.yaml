naftiko: 1.0.0-alpha2
info:
  label: 'Akamai: Application Security API — WAF rules: Update mode'
  description: 'Akamai: Application Security API — WAF rules: Update mode. 2 operations. Lead operation: Akamai API Security
    Get the Current Mode. Self-contained Naftiko capability covering one Akamai Api Security business surface.'
  tags:
  - Akamai Api Security
  - 'WAF rules: Update mode'
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AKAMAI_API_SECURITY_API_KEY: AKAMAI_API_SECURITY_API_KEY
capability:
  consumes:
  - type: http
    namespace: akamai-api-security-waf-rules-update-mode
    baseUri: https://{hostname}/appsec/v1
    description: 'Akamai: Application Security API — WAF rules: Update mode business capability. Self-contained, no shared
      references.'
    resources:
    - name: configs-configId-versions-versionNumber-security-policies-policyId-mode
      path: /configs/{configId}/versions/{versionNumber}/security-policies/{policyId}/mode
      operations:
      - name: getpolicymode
        method: GET
        description: Akamai API Security Get the Current Mode
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountSwitchKey
          in: query
          type: string
          description: For customers who manage more than one account, this [runs the operation from another account](https://techdocs.akamai.com/developer/docs/manage-many-accounts-w
      - name: putpolicymode
        method: PUT
        description: Akamai API Security Modify the Mode
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountSwitchKey
          in: query
          type: string
          description: For customers who manage more than one account, this [runs the operation from another account](https://techdocs.akamai.com/developer/docs/manage-many-accounts-w
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: akamai-api-security-waf-rules-update-mode-rest
    port: 8080
    description: 'REST adapter for Akamai: Application Security API — WAF rules: Update mode. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.'
    resources:
    - path: /v1/configs/{configid}/versions/{versionnumber}/security-policies/{policyid}/mode
      name: configs-configid-versions-versionnumber-security-policies-policyid-mode
      description: REST surface for configs-configId-versions-versionNumber-security-policies-policyId-mode.
      operations:
      - method: GET
        name: getpolicymode
        description: Akamai API Security Get the Current Mode
        call: akamai-api-security-waf-rules-update-mode.getpolicymode
        with:
          accountSwitchKey: rest.accountSwitchKey
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: putpolicymode
        description: Akamai API Security Modify the Mode
        call: akamai-api-security-waf-rules-update-mode.putpolicymode
        with:
          accountSwitchKey: rest.accountSwitchKey
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: akamai-api-security-waf-rules-update-mode-mcp
    port: 9090
    transport: http
    description: 'MCP adapter for Akamai: Application Security API — WAF rules: Update mode. One tool per consumed operation,
      routed inline through this capability''s consumes block.'
    tools:
    - name: akamai-api-security-get-current
      description: Akamai API Security Get the Current Mode
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: akamai-api-security-waf-rules-update-mode.getpolicymode
      with:
        accountSwitchKey: tools.accountSwitchKey
      outputParameters:
      - type: object
        mapping: $.
    - name: akamai-api-security-modify-mode
      description: Akamai API Security Modify the Mode
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: akamai-api-security-waf-rules-update-mode.putpolicymode
      with:
        accountSwitchKey: tools.accountSwitchKey
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
