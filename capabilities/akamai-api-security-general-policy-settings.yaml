naftiko: 1.0.0-alpha2
info:
  label: 'Akamai: Application Security API — General policy settings'
  description: 'Akamai: Application Security API — General policy settings. 5 operations. Lead operation: Akamai API Security
    Clone or Create a Security Policy. Self-contained Naftiko capability covering one Akamai Api Security business surface.'
  tags:
  - Akamai Api Security
  - General policy settings
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AKAMAI_API_SECURITY_API_KEY: AKAMAI_API_SECURITY_API_KEY
capability:
  consumes:
  - type: http
    namespace: akamai-api-security-general-policy-settings
    baseUri: https://{hostname}/appsec/v1
    description: 'Akamai: Application Security API — General policy settings business capability. Self-contained, no shared
      references.'
    resources:
    - name: configs-configId-versions-versionNumber-security-policies
      path: /configs/{configId}/versions/{versionNumber}/security-policies
      operations:
      - name: postpolicy
        method: POST
        description: Akamai API Security Clone or Create a Security Policy
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountSwitchKey
          in: query
          type: string
          description: For customers who manage more than one account, this [runs the operation from another account](https://techdocs.akamai.com/developer/docs/manage-many-accounts-w
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: getpolicies
        method: GET
        description: Akamai API Security List Security Policies
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: notMatched
          in: query
          type: boolean
          description: If `true`, returns all security policies in the configuration version that don't have a match target.  If
            `false`, returns all security policies in the configur
        - name: detail
          in: query
          type: boolean
          description: When `true`, the results contain detailed information on versions. With the default `false`, the results
            contain summary information on versions.
        - name: accountSwitchKey
          in: query
          type: string
          description: For customers who manage more than one account, this [runs the operation from another account](https://techdocs.akamai.com/developer/docs/manage-many-accounts-w
    - name: configs-configId-versions-versionNumber-security-policies-policyId
      path: /configs/{configId}/versions/{versionNumber}/security-policies/{policyId}
      operations:
      - name: getpolicy
        method: GET
        description: Akamai API Security Get a Security Policy
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountSwitchKey
          in: query
          type: string
          description: For customers who manage more than one account, this [runs the operation from another account](https://techdocs.akamai.com/developer/docs/manage-many-accounts-w
      - name: putpolicy
        method: PUT
        description: Akamai API Security Modify a Security Policy
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountSwitchKey
          in: query
          type: string
          description: For customers who manage more than one account, this [runs the operation from another account](https://techdocs.akamai.com/developer/docs/manage-many-accounts-w
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletepolicy
        method: DELETE
        description: Akamai API Security Remove a Security Policy
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountSwitchKey
          in: query
          type: string
          description: For customers who manage more than one account, this [runs the operation from another account](https://techdocs.akamai.com/developer/docs/manage-many-accounts-w
  exposes:
  - type: rest
    namespace: akamai-api-security-general-policy-settings-rest
    port: 8080
    description: 'REST adapter for Akamai: Application Security API — General policy settings. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.'
    resources:
    - path: /v1/configs/{configid}/versions/{versionnumber}/security-policies
      name: configs-configid-versions-versionnumber-security-policies
      description: REST surface for configs-configId-versions-versionNumber-security-policies.
      operations:
      - method: POST
        name: postpolicy
        description: Akamai API Security Clone or Create a Security Policy
        call: akamai-api-security-general-policy-settings.postpolicy
        with:
          accountSwitchKey: rest.accountSwitchKey
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: getpolicies
        description: Akamai API Security List Security Policies
        call: akamai-api-security-general-policy-settings.getpolicies
        with:
          notMatched: rest.notMatched
          detail: rest.detail
          accountSwitchKey: rest.accountSwitchKey
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/configs/{configid}/versions/{versionnumber}/security-policies/{policyid}
      name: configs-configid-versions-versionnumber-security-policies-policyid
      description: REST surface for configs-configId-versions-versionNumber-security-policies-policyId.
      operations:
      - method: GET
        name: getpolicy
        description: Akamai API Security Get a Security Policy
        call: akamai-api-security-general-policy-settings.getpolicy
        with:
          accountSwitchKey: rest.accountSwitchKey
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: putpolicy
        description: Akamai API Security Modify a Security Policy
        call: akamai-api-security-general-policy-settings.putpolicy
        with:
          accountSwitchKey: rest.accountSwitchKey
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletepolicy
        description: Akamai API Security Remove a Security Policy
        call: akamai-api-security-general-policy-settings.deletepolicy
        with:
          accountSwitchKey: rest.accountSwitchKey
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: akamai-api-security-general-policy-settings-mcp
    port: 9090
    transport: http
    description: 'MCP adapter for Akamai: Application Security API — General policy settings. One tool per consumed operation,
      routed inline through this capability''s consumes block.'
    tools:
    - name: akamai-api-security-clone-create
      description: Akamai API Security Clone or Create a Security Policy
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: akamai-api-security-general-policy-settings.postpolicy
      with:
        accountSwitchKey: tools.accountSwitchKey
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: akamai-api-security-list-security
      description: Akamai API Security List Security Policies
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: akamai-api-security-general-policy-settings.getpolicies
      with:
        notMatched: tools.notMatched
        detail: tools.detail
        accountSwitchKey: tools.accountSwitchKey
      outputParameters:
      - type: object
        mapping: $.
    - name: akamai-api-security-get-security
      description: Akamai API Security Get a Security Policy
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: akamai-api-security-general-policy-settings.getpolicy
      with:
        accountSwitchKey: tools.accountSwitchKey
      outputParameters:
      - type: object
        mapping: $.
    - name: akamai-api-security-modify-security
      description: Akamai API Security Modify a Security Policy
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: akamai-api-security-general-policy-settings.putpolicy
      with:
        accountSwitchKey: tools.accountSwitchKey
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: akamai-api-security-remove-security
      description: Akamai API Security Remove a Security Policy
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: akamai-api-security-general-policy-settings.deletepolicy
      with:
        accountSwitchKey: tools.accountSwitchKey
      outputParameters:
      - type: object
        mapping: $.
