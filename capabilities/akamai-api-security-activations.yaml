naftiko: 1.0.0-alpha2
info:
  label: 'Akamai: Application Security API — Activations'
  description: 'Akamai: Application Security API — Activations. 1 operations. Lead operation: Akamai API Security Activate
    a Configuration Version. Self-contained Naftiko capability covering one Akamai Api Security business surface.'
  tags:
  - Akamai Api Security
  - Activations
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AKAMAI_API_SECURITY_API_KEY: AKAMAI_API_SECURITY_API_KEY
capability:
  consumes:
  - type: http
    namespace: akamai-api-security-activations
    baseUri: https://{hostname}/appsec/v1
    description: 'Akamai: Application Security API — Activations business capability. Self-contained, no shared references.'
    resources:
    - name: activations
      path: /activations
      operations:
      - name: postactivations
        method: POST
        description: Akamai API Security Activate a Configuration Version
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountSwitchKey
          in: query
          type: string
          description: For customers who manage more than one account, this [runs the operation from another account](https://techdocs.akamai.com/developer/docs/manage-many-accounts-w
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: akamai-api-security-activations-rest
    port: 8080
    description: 'REST adapter for Akamai: Application Security API — Activations. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.'
    resources:
    - path: /v1/activations
      name: activations
      description: REST surface for activations.
      operations:
      - method: POST
        name: postactivations
        description: Akamai API Security Activate a Configuration Version
        call: akamai-api-security-activations.postactivations
        with:
          accountSwitchKey: rest.accountSwitchKey
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: akamai-api-security-activations-mcp
    port: 9090
    transport: http
    description: 'MCP adapter for Akamai: Application Security API — Activations. One tool per consumed operation, routed
      inline through this capability''s consumes block.'
    tools:
    - name: akamai-api-security-activate-configuration
      description: Akamai API Security Activate a Configuration Version
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: akamai-api-security-activations.postactivations
      with:
        accountSwitchKey: tools.accountSwitchKey
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
