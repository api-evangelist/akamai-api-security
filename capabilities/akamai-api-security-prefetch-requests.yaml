naftiko: 1.0.0-alpha2
info:
  label: 'Akamai: Application Security API — Prefetch requests'
  description: 'Akamai: Application Security API — Prefetch requests. 2 operations. Lead operation: Akamai API Security Get
    Prefetch Requests. Self-contained Naftiko capability covering one Akamai Api Security business surface.'
  tags:
  - Akamai Api Security
  - Prefetch requests
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AKAMAI_API_SECURITY_API_KEY: AKAMAI_API_SECURITY_API_KEY
capability:
  consumes:
  - type: http
    namespace: akamai-api-security-prefetch-requests
    baseUri: https://{hostname}/appsec/v1
    description: 'Akamai: Application Security API — Prefetch requests business capability. Self-contained, no shared references.'
    resources:
    - name: configs-configId-versions-versionNumber-advanced-settings-prefetch
      path: /configs/{configId}/versions/{versionNumber}/advanced-settings/prefetch
      operations:
      - name: getadvancedsettingsprefetch
        method: GET
        description: Akamai API Security Get Prefetch Requests
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountSwitchKey
          in: query
          type: string
          description: For customers who manage more than one account, this [runs the operation from another account](https://techdocs.akamai.com/developer/docs/manage-many-accounts-w
      - name: putadvancedsettingsprefetch
        method: PUT
        description: Akamai API Security Modify Prefetch Requests
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountSwitchKey
          in: query
          type: string
          description: For customers who manage more than one account, this [runs the operation from another account](https://techdocs.akamai.com/developer/docs/manage-many-accounts-w
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: akamai-api-security-prefetch-requests-rest
    port: 8080
    description: 'REST adapter for Akamai: Application Security API — Prefetch requests. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.'
    resources:
    - path: /v1/configs/{configid}/versions/{versionnumber}/advanced-settings/prefetch
      name: configs-configid-versions-versionnumber-advanced-settings-prefetch
      description: REST surface for configs-configId-versions-versionNumber-advanced-settings-prefetch.
      operations:
      - method: GET
        name: getadvancedsettingsprefetch
        description: Akamai API Security Get Prefetch Requests
        call: akamai-api-security-prefetch-requests.getadvancedsettingsprefetch
        with:
          accountSwitchKey: rest.accountSwitchKey
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: putadvancedsettingsprefetch
        description: Akamai API Security Modify Prefetch Requests
        call: akamai-api-security-prefetch-requests.putadvancedsettingsprefetch
        with:
          accountSwitchKey: rest.accountSwitchKey
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: akamai-api-security-prefetch-requests-mcp
    port: 9090
    transport: http
    description: 'MCP adapter for Akamai: Application Security API — Prefetch requests. One tool per consumed operation, routed
      inline through this capability''s consumes block.'
    tools:
    - name: akamai-api-security-get-prefetch
      description: Akamai API Security Get Prefetch Requests
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: akamai-api-security-prefetch-requests.getadvancedsettingsprefetch
      with:
        accountSwitchKey: tools.accountSwitchKey
      outputParameters:
      - type: object
        mapping: $.
    - name: akamai-api-security-modify-prefetch
      description: Akamai API Security Modify Prefetch Requests
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: akamai-api-security-prefetch-requests.putadvancedsettingsprefetch
      with:
        accountSwitchKey: tools.accountSwitchKey
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
