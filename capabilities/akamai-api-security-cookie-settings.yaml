naftiko: 1.0.0-alpha2
info:
  label: 'Akamai: Application Security API — Cookie Settings'
  description: 'Akamai: Application Security API — Cookie Settings. 2 operations. Lead operation: Akamai API Security Get
    Cookie Settings. Self-contained Naftiko capability covering one Akamai Api Security business surface.'
  tags:
  - Akamai Api Security
  - Cookie Settings
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AKAMAI_API_SECURITY_API_KEY: AKAMAI_API_SECURITY_API_KEY
capability:
  consumes:
  - type: http
    namespace: akamai-api-security-cookie-settings
    baseUri: https://{hostname}/appsec/v1
    description: 'Akamai: Application Security API — Cookie Settings business capability. Self-contained, no shared references.'
    resources:
    - name: configs-configId-versions-versionNumber-advanced-settings-cookie-settings
      path: /configs/{configId}/versions/{versionNumber}/advanced-settings/cookie-settings
      operations:
      - name: getadvancedsettingscookiesettings
        method: GET
        description: Akamai API Security Get Cookie Settings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountSwitchKey
          in: query
          type: string
          description: For customers who manage more than one account, this [runs the operation from another account](https://techdocs.akamai.com/developer/docs/manage-many-accounts-w
      - name: putadvancedsettingscookiesettings
        method: PUT
        description: Akamai API Security Modify Cookie Settings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountSwitchKey
          in: query
          type: string
          description: For customers who manage more than one account, this [runs the operation from another account](https://techdocs.akamai.com/developer/docs/manage-many-accounts-w
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: akamai-api-security-cookie-settings-rest
    port: 8080
    description: 'REST adapter for Akamai: Application Security API — Cookie Settings. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.'
    resources:
    - path: /v1/configs/{configid}/versions/{versionnumber}/advanced-settings/cookie-settings
      name: configs-configid-versions-versionnumber-advanced-settings-cookie-settings
      description: REST surface for configs-configId-versions-versionNumber-advanced-settings-cookie-settings.
      operations:
      - method: GET
        name: getadvancedsettingscookiesettings
        description: Akamai API Security Get Cookie Settings
        call: akamai-api-security-cookie-settings.getadvancedsettingscookiesettings
        with:
          accountSwitchKey: rest.accountSwitchKey
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: putadvancedsettingscookiesettings
        description: Akamai API Security Modify Cookie Settings
        call: akamai-api-security-cookie-settings.putadvancedsettingscookiesettings
        with:
          accountSwitchKey: rest.accountSwitchKey
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: akamai-api-security-cookie-settings-mcp
    port: 9090
    transport: http
    description: 'MCP adapter for Akamai: Application Security API — Cookie Settings. One tool per consumed operation, routed
      inline through this capability''s consumes block.'
    tools:
    - name: akamai-api-security-get-cookie
      description: Akamai API Security Get Cookie Settings
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: akamai-api-security-cookie-settings.getadvancedsettingscookiesettings
      with:
        accountSwitchKey: tools.accountSwitchKey
      outputParameters:
      - type: object
        mapping: $.
    - name: akamai-api-security-modify-cookie
      description: Akamai API Security Modify Cookie Settings
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: akamai-api-security-cookie-settings.putadvancedsettingscookiesettings
      with:
        accountSwitchKey: tools.accountSwitchKey
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
