    description: 'REST adapter for Akamai: Application Security API — Client-Side Protections & Compliance. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.'
    resources:
    - path: /v1/configs/{configid}/versions/{versionnumber}/security-policies/{policyid}/cpc
      name: configs-configid-versions-versionnumber-security-policies-policyid-cpc
      description: REST surface for configs-configId-versions-versionNumber-security-policies-policyId-cpc.
      operations:
      - method: GET
        name: getpolicycpc
        description: Akamai API Security Get Client-Side Protection & Compliance Settings
        call: akamai-api-security-client-side-protections-compliance.getpolicycpc
        with:
          accountSwitchKey: rest.accountSwitchKey
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: putpolicycpc
        description: Akamai API Security Modify Client-Side Protections & Compliance Settings
        call: akamai-api-security-client-side-protections-compliance.putpolicycpc
        with:
          accountSwitchKey: rest.accountSwitchKey
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
