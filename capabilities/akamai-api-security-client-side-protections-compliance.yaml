  - type: http
    namespace: akamai-api-security-client-side-protections-compliance
    baseUri: https://{hostname}/appsec/v1
    description: 'Akamai: Application Security API — Client-Side Protections & Compliance business capability. Self-contained,
      no shared references.'
    resources:
    - name: configs-configId-versions-versionNumber-security-policies-policyId-cpc
      path: /configs/{configId}/versions/{versionNumber}/security-policies/{policyId}/cpc
      operations:
      - name: getpolicycpc
        method: GET
        description: Akamai API Security Get Client-Side Protection & Compliance Settings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountSwitchKey
          in: query
          type: string
          description: For customers who manage more than one account, this [runs the operation from another account](https://techdocs.akamai.com/developer/docs/manage-many-accounts-w
      - name: putpolicycpc
        method: PUT
        description: Akamai API Security Modify Client-Side Protections & Compliance Settings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountSwitchKey
          in: query
          type: string
          description: For customers who manage more than one account, this [runs the operation from another account](https://techdocs.akamai.com/developer/docs/manage-many-accounts-w
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
