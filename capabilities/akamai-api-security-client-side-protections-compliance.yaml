naftiko: 1.0.0-alpha2
info:
  label: 'Akamai: Application Security API — Client-Side Protections & Compliance'
  description: 'Akamai: Application Security API — Client-Side Protections & Compliance. 2 operations. Lead operation: Akamai
    API Security Get Client-Side Protection & Compliance Settings. Self-contained Naftiko capability covering one Akamai Api
    Security business surface.'
  tags:
