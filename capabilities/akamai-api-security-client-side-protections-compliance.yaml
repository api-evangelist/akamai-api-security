    port: 9090
    transport: http
    description: 'MCP adapter for Akamai: Application Security API — Client-Side Protections & Compliance. One tool per consumed
      operation, routed inline through this capability''s consumes block.'
    tools:
    - name: akamai-api-security-get-client
      description: Akamai API Security Get Client-Side Protection & Compliance Settings
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: akamai-api-security-client-side-protections-compliance.getpolicycpc
      with:
        accountSwitchKey: tools.accountSwitchKey
      outputParameters:
      - type: object
        mapping: $.
    - name: akamai-api-security-modify-client
      description: Akamai API Security Modify Client-Side Protections & Compliance Settings
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: akamai-api-security-client-side-protections-compliance.putpolicycpc
      with:
        accountSwitchKey: tools.accountSwitchKey
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
