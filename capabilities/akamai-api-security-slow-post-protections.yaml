naftiko: 1.0.0-alpha2
info:
  label: 'Akamai: Application Security API — Slow POST protections'
  description: 'Akamai: Application Security API — Slow POST protections. 2 operations. Lead operation: Akamai API Security
    Get Slow POST Protection Settings. Self-contained Naftiko capability covering one Akamai Api Security business surface.'
  tags:
  - Akamai Api Security
  - Slow POST protections
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AKAMAI_API_SECURITY_API_KEY: AKAMAI_API_SECURITY_API_KEY
capability:
  consumes:
  - type: http
    namespace: akamai-api-security-slow-post-protections
    baseUri: https://{hostname}/appsec/v1
    description: 'Akamai: Application Security API — Slow POST protections business capability. Self-contained, no shared
      references.'
    resources:
    - name: configs-configId-versions-versionNumber-security-policies-policyId-slow-post
      path: /configs/{configId}/versions/{versionNumber}/security-policies/{policyId}/slow-post
      operations:
      - name: getpolicyslowpost
        method: GET
        description: Akamai API Security Get Slow POST Protection Settings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountSwitchKey
          in: query
          type: string
          description: For customers who manage more than one account, this [runs the operation from another account](https://techdocs.akamai.com/developer/docs/manage-many-accounts-w
      - name: putpolicyslowpost
        method: PUT
        description: Akamai API Security Modify Slow POST Protection Settings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountSwitchKey
          in: query
          type: string
          description: For customers who manage more than one account, this [runs the operation from another account](https://techdocs.akamai.com/developer/docs/manage-many-accounts-w
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: akamai-api-security-slow-post-protections-rest
    port: 8080
    description: 'REST adapter for Akamai: Application Security API — Slow POST protections. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.'
    resources:
    - path: /v1/configs/{configid}/versions/{versionnumber}/security-policies/{policyid}/slow-post
      name: configs-configid-versions-versionnumber-security-policies-policyid-slow-post
      description: REST surface for configs-configId-versions-versionNumber-security-policies-policyId-slow-post.
      operations:
      - method: GET
        name: getpolicyslowpost
        description: Akamai API Security Get Slow POST Protection Settings
        call: akamai-api-security-slow-post-protections.getpolicyslowpost
        with:
          accountSwitchKey: rest.accountSwitchKey
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: putpolicyslowpost
        description: Akamai API Security Modify Slow POST Protection Settings
        call: akamai-api-security-slow-post-protections.putpolicyslowpost
        with:
          accountSwitchKey: rest.accountSwitchKey
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: akamai-api-security-slow-post-protections-mcp
    port: 9090
    transport: http
    description: 'MCP adapter for Akamai: Application Security API — Slow POST protections. One tool per consumed operation,
      routed inline through this capability''s consumes block.'
    tools:
    - name: akamai-api-security-get-slow
      description: Akamai API Security Get Slow POST Protection Settings
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: akamai-api-security-slow-post-protections.getpolicyslowpost
      with:
        accountSwitchKey: tools.accountSwitchKey
      outputParameters:
      - type: object
        mapping: $.
    - name: akamai-api-security-modify-slow
      description: Akamai API Security Modify Slow POST Protection Settings
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: akamai-api-security-slow-post-protections.putpolicyslowpost
      with:
        accountSwitchKey: tools.accountSwitchKey
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
