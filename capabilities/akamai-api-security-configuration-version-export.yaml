naftiko: 1.0.0-alpha2
info:
  label: 'Akamai: Application Security API — Configuration version export'
  description: 'Akamai: Application Security API — Configuration version export. 1 operations. Lead operation: Akamai API
    Security Export a Configuration Version. Self-contained Naftiko capability covering one Akamai Api Security business surface.'
  tags:
  - Akamai Api Security
  - Configuration version export
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AKAMAI_API_SECURITY_API_KEY: AKAMAI_API_SECURITY_API_KEY
capability:
  consumes:
  - type: http
    namespace: akamai-api-security-configuration-version-export
    baseUri: https://{hostname}/appsec/v1
    description: 'Akamai: Application Security API — Configuration version export business capability. Self-contained, no
      shared references.'
    resources:
    - name: export-configs-configId-versions-versionNumber
      path: /export/configs/{configId}/versions/{versionNumber}
      operations:
      - name: getexportconfigversion
        method: GET
        description: Akamai API Security Export a Configuration Version
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountSwitchKey
          in: query
          type: string
          description: For customers who manage more than one account, this [runs the operation from another account](https://techdocs.akamai.com/developer/docs/manage-many-accounts-w
  exposes:
  - type: rest
    namespace: akamai-api-security-configuration-version-export-rest
    port: 8080
    description: 'REST adapter for Akamai: Application Security API — Configuration version export. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.'
    resources:
    - path: /v1/export/configs/{configid}/versions/{versionnumber}
      name: export-configs-configid-versions-versionnumber
      description: REST surface for export-configs-configId-versions-versionNumber.
      operations:
      - method: GET
        name: getexportconfigversion
        description: Akamai API Security Export a Configuration Version
        call: akamai-api-security-configuration-version-export.getexportconfigversion
        with:
          accountSwitchKey: rest.accountSwitchKey
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: akamai-api-security-configuration-version-export-mcp
    port: 9090
    transport: http
    description: 'MCP adapter for Akamai: Application Security API — Configuration version export. One tool per consumed operation,
      routed inline through this capability''s consumes block.'
    tools:
    - name: akamai-api-security-export-configuration
      description: Akamai API Security Export a Configuration Version
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: akamai-api-security-configuration-version-export.getexportconfigversion
      with:
        accountSwitchKey: tools.accountSwitchKey
      outputParameters:
      - type: object
        mapping: $.
